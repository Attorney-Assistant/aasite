<!-- @dsCard group="Comic / Components" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --comic-navy-deep: #061320;
    --comic-gold: #F9A630;
    --comic-gold-bright: #FBD46D;
    --comic-red: #e02a2a;
    --comic-blue: #5087dd;
    --comic-white: #fff;
    --comic-font-display: 'Bangers', cursive;
    --comic-shadow-md: 4px 4px 0 #061320;
    --comic-radius: 10px;
  }
  body { background: #0e2236; display: flex; gap: 32px; flex-wrap: wrap; align-items: center; padding: 64px 48px; font-family: 'Inter', sans-serif; }
  .eyebrow {
    display: inline-block;
    background: var(--comic-red);
    color: #fff;
    padding: 8px 16px;
    font-family: var(--comic-font-display);
    letter-spacing: 0.12em;
    transform: rotate(-2deg);
    box-shadow: var(--comic-shadow-md);
    font-size: 20px;
  }
  .gold {
    background: var(--comic-gold);
    color: var(--comic-navy-deep);
  }
</style></head><body>
  <span class="eyebrow">NASHVILLE · SPECIAL OFFER</span>
  <span class="eyebrow gold">WE'RE HIRING</span>
</body></html>
