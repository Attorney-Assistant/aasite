<!-- @dsCard group="Comic / Components" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --comic-navy-deep: #061320;
    --comic-gold: #F9A630;
    --comic-red: #e02a2a;
    --comic-blue: #5087dd;
    --comic-font-display: 'Bangers', cursive;
    --comic-font-subhead: 'Sora', sans-serif;
  }
  body { background: #0e2236; display: flex; flex-direction: column; gap: 32px; padding: 64px 48px; font-family: 'Inter', sans-serif; max-width: 600px; }
  .banner {
    display: flex;
    gap: 16px;
    align-items: center;
    background: rgba(80,135,221,0.12);
    border: 2px solid var(--comic-blue);
    border-radius: 4px;
    padding: 16px 18px 16px 24px;
    box-shadow: 5px 5px 0 var(--comic-navy-deep);
    transform: rotate(-0.4deg);
  }
  .bannerLabel {
    flex-shrink: 0;
    background: var(--comic-red);
    color: #fff;
    padding: 6px 12px;
    font-family: var(--comic-font-display);
    letter-spacing: 0.08em;
    transform: rotate(-6deg);
    box-shadow: 2px 2px 0 var(--comic-navy-deep);
    font-size: 18px;
  }
  .bannerText {
    font-family: var(--comic-font-subhead);
    font-weight: 700;
    font-size: 15px;
    color: #fff;
    line-height: 1.4;
  }
  .bannerGold .bannerLabel { background: var(--comic-gold); color: var(--comic-navy-deep); }
</style></head><body>
  <div class="banner">
    <span class="bannerLabel">URGENT!</span>
    <span class="bannerText">Conference pricing locks in only while spots remain.</span>
  </div>
  <div class="banner bannerGold">
    <span class="bannerLabel">LIMITED</span>
    <span class="bannerText">Only 3 consultation slots left this week — book before they're gone.</span>
  </div>
</body></html>
