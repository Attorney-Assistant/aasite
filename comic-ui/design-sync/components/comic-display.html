<!-- @dsCard group="Comic / Components" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --comic-navy-deep: #061320;
    --comic-gold: #F9A630;
    --comic-font-display: 'Bangers', cursive;
    --comic-display: clamp(56px, 8vw, 96px);
    --comic-shadow-text: 4px 4px 0 #061320;
  }
  body { background: #0e2236; display: flex; flex-direction: column; gap: 32px; padding: 64px 48px; font-family: 'Inter', sans-serif; }
  .display {
    font-family: var(--comic-font-display);
    text-transform: uppercase;
    line-height: 0.95;
    letter-spacing: 0.02em;
    color: #fff;
    text-shadow: var(--comic-shadow-text);
    font-size: var(--comic-display);
    margin: 0;
  }
  .gold { color: var(--comic-gold); }
</style></head><body>
  <h1 class="display">LOCK IN YOUR RATE.</h1>
  <h1 class="display gold">NO FEES UNTIL WE WIN.</h1>
</body></html>
