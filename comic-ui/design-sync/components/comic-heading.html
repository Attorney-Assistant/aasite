<!-- @dsCard group="Comic / Components" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --comic-navy-deep: #061320;
    --comic-gold: #F9A630;
    --comic-font-display: 'Bangers', cursive;
    --comic-display-md: clamp(36px, 5vw, 60px);
    --comic-shadow-text: 4px 4px 0 #061320;
  }
  body { background: #0e2236; display: flex; flex-direction: column; gap: 28px; padding: 64px 48px; font-family: 'Inter', sans-serif; }
  .heading {
    font-family: var(--comic-font-display);
    text-transform: uppercase;
    line-height: 0.95;
    letter-spacing: 0.02em;
    color: #fff;
    text-shadow: var(--comic-shadow-text);
    font-size: var(--comic-display-md);
    margin: 0;
  }
  .gold { color: var(--comic-gold); }
</style></head><body>
  <h2 class="heading">Pick your contract.</h2>
  <h2 class="heading gold">Choose your attorney.</h2>
  <h3 class="heading" style="font-size: clamp(28px, 4vw, 44px);">As h3 — smaller scale.</h3>
</body></html>
