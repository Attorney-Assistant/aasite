<!-- @dsCard group="Comic / Components" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --comic-navy-deep: #061320;
    --comic-gold: #F9A630;
    --comic-red: #e02a2a;
    --comic-font-display: 'Bangers', cursive;
    --comic-radius-lg: 16px;
    --comic-shadow-frame: 8px 8px 0 #061320;
    --comic-shadow-sm: 2px 2px 0 rgba(0,0,0,0.3);
  }
  body { background: #0e2236; display: flex; gap: 48px; flex-wrap: wrap; align-items: flex-start; padding: 80px 48px; font-family: 'Inter', sans-serif; }
  .panel {
    position: relative;
    background: #fff;
    border: 4px solid var(--comic-gold);
    border-radius: var(--comic-radius-lg);
    box-shadow: var(--comic-shadow-frame);
    padding: 32px;
    color: var(--comic-navy-deep);
    max-width: 320px;
  }
  .tape {
    position: absolute;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--comic-font-display);
    font-size: 24px;
    box-shadow: var(--comic-shadow-sm);
    background: var(--comic-red);
    color: #fff;
  }
  .tapeTL { top: -18px; left: -18px; transform: rotate(-12deg); }
  .tapeTR { top: -18px; right: -18px; transform: rotate(12deg); background: var(--comic-gold); color: var(--comic-navy-deep); }
  .panel h3 { font-family: 'Bangers', cursive; font-size: 26px; margin: 0 0 10px; color: var(--comic-navy-deep); }
  .panel p { font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.6; margin: 0; color: #334; }
</style></head><body>
  <div class="panel">
    <span class="tape tapeTL">★</span>
    <span class="tape tapeTR">★</span>
    <h3>CLIENT TESTIMONIAL</h3>
    <p>"They got me 3x what the insurance company offered. I couldn't believe it. Highly recommend Attorney Assistant."</p>
  </div>
</body></html>
