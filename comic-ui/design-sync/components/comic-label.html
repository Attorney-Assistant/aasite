<!-- @dsCard group="Comic / Components" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --comic-navy-deep: #061320;
    --comic-gold: #F9A630;
    --comic-red: #e02a2a;
    --comic-font-display: 'Bangers', cursive;
  }
  body { background: #0e2236; display: flex; gap: 40px; flex-wrap: wrap; align-items: center; padding: 64px 48px; font-family: 'Inter', sans-serif; }
  .label {
    display: inline-block;
    background: var(--comic-red);
    color: #fff;
    padding: 6px 16px;
    font-family: var(--comic-font-display);
    letter-spacing: 0.16em;
    transform: rotate(-3deg);
    box-shadow: 3px 3px 0 var(--comic-gold);
    font-size: 22px;
  }
  .gold {
    background: var(--comic-gold);
    color: var(--comic-navy-deep);
    box-shadow: 3px 3px 0 var(--comic-navy-deep);
  }
</style></head><body>
  <span class="label">STEP 1</span>
  <span class="label gold">URGENT!</span>
</body></html>
