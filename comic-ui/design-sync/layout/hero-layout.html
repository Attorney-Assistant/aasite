<!-- @dsCard group="Comic / Layout" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{--comic-navy:#0e2236;--comic-navy-deep:#061320;--comic-gold:#F9A630;--comic-white:#fff;--comic-blue:#5087dd;}
  body{background:var(--comic-navy);padding:64px 32px;font-family:'Inter',sans-serif;color:var(--comic-white);margin:0;}
  .hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:center;max-width:1240px;margin:0 auto;}
  .eyebrow{font-family:'Sora',sans-serif;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--comic-gold);margin-bottom:16px;}
  h1{font-family:'Bangers',sans-serif;font-size:64px;letter-spacing:.05em;line-height:1;margin:0 0 20px;text-shadow:4px 4px 0 rgba(0,0,0,0.5);}
  p{font-size:18px;line-height:1.6;color:rgba(255,255,255,0.8);margin:0 0 28px;}
  .btn{display:inline-block;font-family:'Bangers',sans-serif;letter-spacing:.08em;font-size:22px;padding:14px 28px;background:var(--comic-gold);color:var(--comic-navy-deep);border:none;border-radius:8px;box-shadow:5px 5px 0 rgba(0,0,0,0.4);cursor:pointer;transform:rotate(-1deg);}
  .art{background:rgba(80,135,221,0.15);border:2px dashed var(--comic-blue);border-radius:12px;height:340px;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-size:13px;font-weight:600;color:var(--comic-blue);letter-spacing:.08em;text-transform:uppercase;}
</style></head><body>
  <div class="hero">
    <div>
      <div class="eyebrow">Hero Layout — Left Column</div>
      <h1>Your Legal Edge Starts Here</h1>
      <p>Attorney Assistant delivers comic-book energy to your law firm marketing — bold, fast, and built to convert.</p>
      <button class="btn">Get Started →</button>
    </div>
    <div>
      <div class="art">Art / Image Placeholder</div>
    </div>
  </div>
</body></html>
