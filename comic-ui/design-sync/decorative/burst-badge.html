<!-- @dsCard group="Comic / Decorative" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BurstBadge</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0e2236;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Bangers', cursive;
    color: #F9A630;
    gap: 16px;
  }
  .label {
    font-size: 14px;
    letter-spacing: 0.15em;
    opacity: 0.6;
    text-transform: uppercase;
  }
  .badges {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .badge {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 140px;
    height: 140px;
  }
  .burst-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .text {
    position: relative;
    font-family: 'Bangers', cursive;
    color: #1a3a5c;
    font-size: 24px;
    text-align: center;
    line-height: 1.1;
  }
</style>
</head>
<body>
  <span class="label">BurstBadge</span>
  <div class="badges">
    <div class="badge">
      <img class="burst-img" src="../../src/assets/burst-1.svg" alt="" />
      <span class="text">NEW!</span>
    </div>
    <div class="badge">
      <img class="burst-img" src="../../src/assets/burst-2.svg" alt="" />
      <span class="text">HOT!</span>
    </div>
    <div class="badge">
      <img class="burst-img" src="../../src/assets/burst-3.svg" alt="" />
      <span class="text">FREE</span>
    </div>
    <div class="badge">
      <img class="burst-img" src="../../src/assets/burst-4.svg" alt="" />
      <span class="text">WOW!</span>
    </div>
  </div>
</body>
</html>
