<!-- @dsCard group="Comic / Decorative" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ScrollReveal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0e2236;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Bangers', cursive;
    color: #F9A630;
    gap: 24px;
  }
  .label {
    font-size: 14px;
    letter-spacing: 0.15em;
    opacity: 0.6;
    text-transform: uppercase;
  }
  /* Final visible state — animates from opacity:0 translateY(30px) on scroll in-app */
  .reveal-demo {
    opacity: 1;
    transform: translateY(0);
    border: 2px solid rgba(249,166,48,0.4);
    border-radius: 6px;
    padding: 28px 40px;
    text-align: center;
    width: 280px;
  }
  .reveal-demo h2 {
    font-size: 36px;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .reveal-demo p {
    font-family: sans-serif;
    font-size: 13px;
    opacity: 0.55;
    letter-spacing: 0.04em;
  }
  .note {
    font-family: sans-serif;
    font-size: 11px;
    opacity: 0.35;
    letter-spacing: 0.03em;
    text-align: center;
  }
</style>
</head>
<body>
  <span class="label">ScrollReveal</span>
  <!-- Shown in final visible state; in-app animates from opacity:0 + translateY(30px) on viewport entry -->
  <div class="reveal-demo">
    <h2>REVEALED</h2>
    <p>Fades up from below on scroll</p>
  </div>
  <span class="note">* Static preview — animates on scroll in real app</span>
</body>
</html>
