<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Speedlines</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0e2236;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Bangers', cursive;
    color: #F9A630;
    gap: 16px;
  }
  .label {
    font-size: 14px;
    letter-spacing: 0.15em;
    opacity: 0.6;
    text-transform: uppercase;
  }
  .panel {
    position: relative;
    width: 300px;
    height: 140px;
    background: #1a3a5c;
    border: 3px solid #F9A630;
    border-radius: 4px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .speedlines {
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      90deg,
      rgba(255,255,255,0.18) 0 2px,
      transparent 2px 10px
    );
    opacity: .5;
  }
  .pow {
    position: relative;
    font-size: 64px;
    letter-spacing: 0.06em;
    color: #F9A630;
    text-shadow: 4px 4px 0 #0e2236;
    z-index: 1;
  }
</style>
</head>
<body>
  <span class="label">Speedlines</span>
  <div class="panel">
    <div class="speedlines"></div>
    <span class="pow">POW</span>
  </div>
</body>
</html>
