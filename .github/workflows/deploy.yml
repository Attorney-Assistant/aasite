name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily rebuild at 6 AM EST (11 AM UTC)
  schedule:
    - cron: '0 11 * * *'
  # Rebuild on HubSpot blog post publish/update
  repository_dispatch:
    types: [hubspot_blog_update]
  # Allow manual trigger
  workflow_dispatch:

env:
  HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
  SITE_URL: ${{ secrets.SITE_URL || 'https://attorneyassistant.com' }}
  GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_MAPS_API }}
  BABYLOVEGROWTH: ${{ secrets.BABYLOVEGROWTH }}
  FB_CAREERS_PIXEL_DATA_ACCESS_TOKEN: ${{ secrets.FB_CAREERS_PIXEL_DATA_ACCESS_TOKEN }}
  FB_PIXEL_DATA_ACCESS_TOKEN: ${{ secrets.FB_PIXEL_DATA_ACCESS_TOKEN }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      # Persist fetched BabyLoveGrowth article bodies between runs so each build
      # only fetches NEW articles (not the full set). Unique key per run + prefix
      # restore-keys means we restore the latest cache and always save an updated
      # one. Kept warm by the daily cron, so eviction (and a full re-fetch) is rare.
      - name: Cache BLG articles
        uses: actions/cache@v4
        with:
          path: scripts/output/blg-cache.json
          key: blg-article-cache-${{ github.run_id }}
          restore-keys: |
            blg-article-cache-

      - name: Build site
        run: npm run build

      - name: Deploy to FTP
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/public_html/' }}
